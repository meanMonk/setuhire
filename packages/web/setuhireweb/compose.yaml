# Per-app compose. Joins the shared external vaayu_db network.
# Run:  docker compose -f compose.yaml up -d --build
name: vaayu-setuhireweb

services:
  setuhireweb:
    build: .
    image: setuhireweb:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3421:3000"
    networks: [vaayu_db]

networks:
  vaayu_db:
    external: true
